<script>
  let defaultChannels = ['askreddit', 'technology', 'worldnews', 'funny', 'todayilearned', 'python'];
  let currentChannel = 'askreddit';

  async function fetchRSS(subreddit) {
    const rssUrl = `https://www.reddit.com/r/${subreddit}/.rss`;
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error("Fetch failed");
    return await res.json();
  }

  async function fetchCommentsRSS(link) {
    // Clean URL down to clean permalink path before appending .rss
    const cleanLink = link.split('?')[0].replace(/\/$/, '');
    const rssUrl = `${cleanLink}/.rss`;
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error("Fetch failed");
    return await res.json();
  }

  function init() {
    renderChannels();
    switchChannel(currentChannel);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') togglePanic();
    });
  }

  function renderChannels() {
    const container = document.getElementById('channels-container');
    container.innerHTML = '';
    defaultChannels.forEach(ch => {
      const activeClass = ch.toLowerCase() === currentChannel.toLowerCase() ? 'active' : '';
      container.innerHTML += `
        <div class="channel-item ${activeClass}" onclick="switchChannel('${ch}')">
          <span class="channel-prefix">#</span>
          <span>${ch}</span>
        </div>
      `;
    });
  }

  async function switchChannel(channelName) {
    currentChannel = channelName.replace(/^r\//, '').replace(/^#/, '').toLowerCase();
    document.getElementById('channel-title').innerText = currentChannel;
    document.getElementById('dummy-input').placeholder = `Message #${currentChannel}`;
    renderChannels();
    closeThread();
    loadCurrentChannel();
  }

  async function loadCurrentChannel() {
    const container = document.getElementById('messages-container');
    container.innerHTML = `<div style="color: #9CA3AF; text-align: center; padding: 40px; font-size: 12px;">Syncing #${currentChannel}...</div>`;

    try {
      const data = await fetchRSS(currentChannel);
      container.innerHTML = '';

      if (!data.items || data.items.length === 0) {
        container.innerHTML = `<div style="color: #9CA3AF; padding: 20px; font-size: 12px;">No posts found for #${currentChannel}.</div>`;
        return;
      }

      data.items.forEach(p => {
        const author = p.author || 'reddit_user';
        const pubDate = new Date(p.pubDate).getTime() / 1000;
        const cleanTitle = decodeHTML(p.title);
        
        container.innerHTML += `
          <div class="msg-card">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${author}" class="msg-avatar">
            <div style="flex: 1; min-width: 0;">
              <div class="msg-header">
                <span class="msg-author">${escapeHTML(author)}</span>
                <span class="msg-time">${formatTime(pubDate)}</span>
              </div>
              <div class="msg-title">${cleanTitle}</div>
              <button onclick="openThread('${p.link}')" class="thread-btn">
                💬 View Comments Thread
              </button>
            </div>
          </div>
        `;
      });

    } catch (err) {
      container.innerHTML = `<div style="color: #EF4444; padding: 20px; font-size: 12px;">Failed to load channel feed. Click Refresh to try again.</div>`;
    }
  }

  async function openThread(link) {
    const sidebar = document.getElementById('thread-sidebar');
    const body = document.getElementById('thread-body');
    
    sidebar.classList.remove('hidden');
    body.innerHTML = `<div style="color: #9CA3AF; text-align: center; padding: 20px; font-size: 12px;">Loading comments...</div>`;

    try {
      const data = await fetchCommentsRSS(link);
      body.innerHTML = '';

      // First RSS entry is the main post itself
      const comments = data.items.slice(1);

      if (comments.length === 0) {
        body.innerHTML = `<div style="color: #9CA3AF; padding: 12px; font-size: 12px;">No comments available for this post.</div>`;
        return;
      }

      comments.forEach(c => {
        const author = c.author || 'commenter';
        const pubDate = new Date(c.pubDate).getTime() / 1000;
        
        // Strip HTML markup and decode html entities
        let cleanText = c.content.replace(/<[^>]*>?/gm, '').trim();
        cleanText = decodeHTML(cleanText);

        body.innerHTML += `
          <div class="comment-card">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${author}" class="comment-avatar">
            <div style="flex: 1; min-width: 0;">
              <div>
                <span class="comment-author">${escapeHTML(author)}</span>
                <span style="font-size: 10px; color: #6B7280; margin-left: 6px;">${formatTime(pubDate)}</span>
              </div>
              <div class="comment-text">${cleanText.slice(0, 350)}</div>
            </div>
          </div>
        `;
      });
    } catch (e) {
      body.innerHTML = `<div style="color: #EF4444; font-size: 12px;">Failed to load thread comments.</div>`;
    }
  }

  function closeThread() { document.getElementById('thread-sidebar').classList.add('hidden'); }
  function togglePanic() { document.getElementById('panic-overlay').classList.toggle('active'); }

  function formatTime(utcSeconds) {
    if (!utcSeconds) return 'just now';
    const diff = Math.floor((Date.now() / 1000) - utcSeconds);
    if (diff < 60) return 'just now';
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  function decodeHTML(html) {
    const txt = document.createElement('textarea');
    txt.innerHTML = html;
    return txt.value;
  }

  window.onload = init;
</script>
