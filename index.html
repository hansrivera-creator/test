<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slack | General</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #1A1D21; color: #D1D5DB; }
    
    .app-header { height: 40px; background: #121016; border-bottom: 1px solid #2D3748; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; user-select: none; }
    .search-input { width: 100%; max-width: 500px; background: #222529; border: 1px solid #374151; border-radius: 4px; padding: 4px 12px; color: #E5E7EB; font-size: 12px; outline: none; }
    .panic-btn { background: #DC2626; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
    
    .app-main { display: flex; height: calc(100vh - 40px); width: 100vw; }
    
    .sidebar { width: 220px; background: #3F0E40; border-right: 1px solid #2D3748; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { height: 48px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: white; font-weight: bold; }
    .channel-item { padding: 6px 16px; font-size: 13px; color: #9CA3AF; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .channel-item:hover { background: #350D36; color: white; }
    .channel-item.active { background: #1164A3; color: white; font-weight: bold; }
    
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #1A1D21; min-width: 0; }
    .chat-header { height: 48px; border-bottom: 1px solid #2D3748; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; color: white; }
    .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    
    .msg-card { display: flex; gap: 12px; padding: 10px; border-radius: 6px; }
    .msg-card:hover { background: rgba(34, 37, 41, 0.6); }
    .msg-avatar { width: 36px; height: 36px; border-radius: 4px; background: #374151; flex-shrink: 0; }
    .msg-author { font-weight: bold; color: white; font-size: 14px; margin-right: 8px; }
    .msg-time { font-size: 11px; color: #6B7280; }
    .msg-title { font-size: 14px; color: #E5E7EB; margin-top: 2px; line-height: 1.4; }
    .msg-body { font-size: 12px; color: #9CA3AF; margin-top: 4px; line-height: 1.4; max-height: 80px; overflow: hidden; }
    .thread-btn { margin-top: 6px; background: none; border: none; color: #60A5FA; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .thread-btn:hover { text-decoration: underline; }

    .thread-sidebar { width: 360px; background: #1A1D21; border-left: 1px solid #2D3748; display: flex; flex-direction: column; flex-shrink: 0; }
    .thread-sidebar.hidden { display: none; }
    .thread-header { height: 48px; border-bottom: 1px solid #2D3748; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: white; font-weight: bold; font-size: 14px; }
    .thread-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .comment-card { display: flex; gap: 10px; font-size: 12px; }
    .comment-author { font-weight: bold; color: #D1D5DB; }
    .comment-text { color: #9CA3AF; margin-top: 2px; line-height: 1.4; }
    .close-btn { background: none; border: none; color: #9CA3AF; font-size: 16px; cursor: pointer; }
    .close-btn:hover { color: white; }

    #panic-overlay { position: fixed; inset: 0; background: #1A1D21; z-index: 9999; padding: 32px; display: none; }
    #panic-overlay.active { display: block; }
  </style>
</head>
<body>

  <div class="app-header">
    <div style="color: #9CA3AF; font-size: 12px;">🕒 Workspace</div>
    <input id="subreddit-search" class="search-input" type="text" placeholder="Search subreddit (e.g. askreddit, technology)..." onkeydown="if(event.key==='Enter') switchChannel(this.value)">
    <button onclick="togglePanic()" class="panic-btn">🛡️ Panic Mode (Esc)</button>
  </div>

  <div class="app-main">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Shopify Workspace</span>
      </div>
      <div style="padding: 12px 0;">
        <div style="padding: 0 16px 8px; font-size: 11px; font-weight: bold; color: #9CA3AF; text-transform: uppercase;">Channels</div>
        <div id="channels-container"></div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <span id="channel-title" style="font-weight: bold; font-size: 16px;"># askreddit</span>
        <button onclick="loadCurrentChannel()" style="background: #222529; border: 1px solid #374151; color: white; padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;">🔄 Refresh</button>
      </div>

      <div id="messages-container" class="messages-container"></div>

      <div style="padding: 16px; border-top: 1px solid #2D3748;">
        <input type="text" placeholder="Message #channel" style="width: 100%; background: #222529; border: 1px solid #374151; border-radius: 6px; padding: 10px; color: white; font-size: 13px; outline: none;">
      </div>
    </div>

    <div id="thread-sidebar" class="thread-sidebar hidden">
      <div class="thread-header">
        <span>Thread Comments</span>
        <button onclick="closeThread()" class="close-btn">✕</button>
      </div>
      <div id="thread-body" class="thread-body"></div>
    </div>
  </div>

  <div id="panic-overlay">
    <div style="max-width: 800px; margin: 0 auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; padding-bottom: 16px;">
        <h2 style="color: white; font-size: 18px;">⚠️ Shopify Support Log #70665123</h2>
        <button onclick="togglePanic()" style="background: #374151; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Resume</button>
      </div>
      <div style="background: #222529; padding: 16px; margin-top: 16px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #10B981;">
        [2026-10-15 17:50:12 UTC] STATUS: RESOLVED - Merchant Migration Rates
      </div>
    </div>
  </div>

  <script>
    let defaultChannels = ['askreddit', 'technology', 'worldnews', 'funny', 'todayilearned', 'python'];
    let currentChannel = 'askreddit';

    async function fetchRSS(subreddit) {
      const rssUrl = `https://www.reddit.com/r/${subreddit}/.rss`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error("Fetch failed");
      return await res.json();
    }

    async function fetchCommentsRSS(link) {
      const rssUrl = `${link.replace(/\/$/, '')}/.rss`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error("Fetch failed");
      return await res.json();
    }

    function init() {
      renderChannels();
      switchChannel(currentChannel);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') togglePanic();
      });
    }

    function renderChannels() {
      const container = document.getElementById('channels-container');
      container.innerHTML = '';
      defaultChannels.forEach(ch => {
        const activeClass = ch.toLowerCase() === currentChannel.toLowerCase() ? 'active' : '';
        container.innerHTML += `
          <div class="channel-item ${activeClass}" onclick="switchChannel('${ch}')">
            <span>#</span>
            <span>${ch}</span>
          </div>
        `;
      });
    }

    async function switchChannel(channelName) {
      currentChannel = channelName.replace(/^r\//, '').replace(/^#/, '').toLowerCase();
      document.getElementById('channel-title').innerText = `# ${currentChannel}`;
      renderChannels();
      closeThread();
      loadCurrentChannel();
    }

    async function loadCurrentChannel() {
      const container = document.getElementById('messages-container');
      container.innerHTML = `<div style="color: #9CA3AF; text-align: center; padding: 40px;">Syncing #${currentChannel}...</div>`;

      try {
        const data = await fetchRSS(currentChannel);
        container.innerHTML = '';

        data.items.forEach(p => {
          const author = p.author || 'reddit_user';
          const pubDate = new Date(p.pubDate).getTime() / 1000;
          
          container.innerHTML += `
            <div class="msg-card">
              <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${author}" class="msg-avatar">
              <div style="flex: 1;">
                <div>
                  <span class="msg-author">${escapeHTML(author)}</span>
                  <span class="msg-time">${formatTime(pubDate)}</span>
                </div>
                <div class="msg-title">${escapeHTML(p.title)}</div>
                <button onclick="openThread('${p.link}')" class="thread-btn">
                  💬 View Comments Thread
                </button>
              </div>
            </div>
          `;
        });

      } catch (err) {
        container.innerHTML = `<div style="color: #EF4444; padding: 20px;">Failed to load feed. Click Refresh to try again.</div>`;
      }
    }

    async function openThread(link) {
      const sidebar = document.getElementById('thread-sidebar');
      const body = document.getElementById('thread-body');
      
      sidebar.classList.remove('hidden');
      body.innerHTML = `<div style="color: #9CA3AF; text-align: center; padding: 20px;">Loading comments...</div>`;

      try {
        const data = await fetchCommentsRSS(link);
        body.innerHTML = '';

        // First item in comments RSS is the main post description
        const comments = data.items.slice(1);

        if (comments.length === 0) {
          body.innerHTML = `<div style="color: #9CA3AF; padding: 12px; font-size: 12px;">No comments found or thread is locked.</div>`;
          return;
        }

        comments.forEach(c => {
          const author = c.author || 'commenter';
          const pubDate = new Date(c.pubDate).getTime() / 1000;
          // Clean HTML tags from RSS content string
          const cleanText = c.content.replace(/<[^>]*>?/gm, '').trim();

          body.innerHTML += `
            <div class="comment-card">
              <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${author}" style="width:24px; height:24px; border-radius:4px; flex-shrink:0;">
              <div>
                <div>
                  <span class="comment-author">${escapeHTML(author)}</span>
                  <span style="font-size:10px; color:#6B7280; margin-left:6px;">${formatTime(pubDate)}</span>
                </div>
                <div class="comment-text">${escapeHTML(cleanText.slice(0, 300))}</div>
              </div>
            </div>
          `;
        });
      } catch (e) {
        body.innerHTML = `<div style="color:#EF4444; font-size:12px;">Failed to load comments thread.</div>`;
      }
    }

    function closeThread() { document.getElementById('thread-sidebar').classList.add('hidden'); }
    function togglePanic() { document.getElementById('panic-overlay').classList.toggle('active'); }

    function formatTime(utcSeconds) {
      if (!utcSeconds) return 'just now';
      const diff = Math.floor((Date.now() / 1000) - utcSeconds);
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return `${Math.floor(diff/86400)}d ago`;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.onload = init;
  </script>
</body>
</html>
