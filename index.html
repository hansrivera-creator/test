<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slack | General</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #1A1D21; color: #D1D5DB; }
    
    .app-header { height: 38px; background: #121016; border-bottom: 1px solid #2D3748; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; user-select: none; }
    .search-input { width: 100%; max-width: 460px; background: #222529; border: 1px solid #374151; border-radius: 5px; padding: 4px 12px; color: #E5E7EB; font-size: 12px; outline: none; }
    .search-input:focus { border-color: #3B82F6; }
    .panic-btn { background: #DC2626; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .panic-btn:hover { background: #B91C1C; }
    
    .app-main { display: flex; height: calc(100vh - 38px); width: 100vw; }
    
    .sidebar { width: 220px; background: #3F0E40; border-right: 1px solid #2D3748; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { height: 44px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: white; font-weight: 700; font-size: 14px; }
    .sidebar-section-title { padding: 12px 16px 4px; font-size: 11px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; }
    .channel-item { padding: 5px 16px; font-size: 13px; color: #9CA3AF; cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: 0 4px 4px 0; margin-right: 8px; }
    .channel-item:hover { background: #350D36; color: white; }
    .channel-item.active { background: #1164A3; color: white; font-weight: 600; }
    .channel-prefix { color: #6B7280; font-weight: normal; }
    .channel-item.active .channel-prefix { color: rgba(255,255,255,0.7); }
    
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #1A1D21; min-width: 0; }
    .chat-header { height: 44px; border-bottom: 1px solid #2D3748; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: white; flex-shrink: 0; }
    .chat-title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .refresh-btn { background: #222529; border: 1px solid #374151; color: #D1D5DB; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: background 0.15s; }
    .refresh-btn:hover { background: #2D3748; color: white; }
    
    .messages-container { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg-card { display: flex; gap: 12px; padding: 8px 10px; border-radius: 6px; transition: background 0.1s; }
    .msg-card:hover { background: rgba(255, 255, 255, 0.03); }
    .msg-avatar { width: 36px; height: 36px; border-radius: 4px; background: #2D3748; flex-shrink: 0; object-fit: cover; }
    .msg-header { display: flex; align-items: baseline; gap: 8px; }
    .msg-author { font-weight: 700; color: white; font-size: 13px; cursor: pointer; }
    .msg-author:hover { text-decoration: underline; }
    .msg-time { font-size: 11px; color: #6B7280; }
    .msg-title { font-size: 13px; color: #E5E7EB; margin-top: 2px; line-height: 1.45; word-break: break-word; }
    
    .thread-btn { margin-top: 6px; background: none; border: none; color: #60A5FA; font-size: 11px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; }
    .thread-btn:hover { text-decoration: underline; }

    .thread-sidebar { width: 380px; background: #1A1D21; border-left: 1px solid #2D3748; display: flex; flex-direction: column; flex-shrink: 0; }
    .thread-sidebar.hidden { display: none; }
    .thread-header { height: 44px; border-bottom: 1px solid #2D3748; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: white; font-weight: 700; font-size: 13px; }
    .thread-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .comment-card { display: flex; gap: 10px; font-size: 12px; }
    .comment-avatar { width: 26px; height: 26px; border-radius: 4px; background: #2D3748; flex-shrink: 0; object-fit: cover; }
    .comment-author { font-weight: 700; color: #E5E7EB; }
    .comment-text { color: #9CA3AF; margin-top: 3px; line-height: 1.4; word-break: break-word; }
    .close-btn { background: none; border: none; color: #9CA3AF; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 3px; }
    .close-btn:hover { color: white; background: #2D3748; }

    .input-wrapper { padding: 12px 20px; border-top: 1px solid #2D3748; background: #1A1D21; }
    .message-input { width: 100%; background: #222529; border: 1px solid #374151; border-radius: 6px; padding: 8px 12px; color: white; font-size: 12px; outline: none; }

    #panic-overlay { position: fixed; inset: 0; background: #1A1D21; z-index: 9999; padding: 32px; display: none; }
    #panic-overlay.active { display: block; }
  </style>
</head>
<body>

  <div class="app-header">
    <div style="color: #9CA3AF; font-size: 11px; font-weight: 600;">🕒 Workspace</div>
    <input id="subreddit-search" class="search-input" type="text" placeholder="Search subreddit (e.g. askreddit, technology)..." onkeydown="if(event.key==='Enter') switchChannel(this.value)">
    <button onclick="togglePanic()" class="panic-btn">🛡️ Panic Mode (Esc)</button>
  </div>

  <div class="app-main">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Shopify Workspace</span>
      </div>
      <div style="padding: 8px 0;">
        <div class="sidebar-section-title">Channels</div>
        <div id="channels-container"></div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div class="chat-title">
          <span style="color: #6B7280;">#</span>
          <span id="channel-title">askreddit</span>
        </div>
        <button onclick="loadCurrentChannel()" class="refresh-btn">🔄 Refresh</button>
      </div>

      <div id="messages-container" class="messages-container"></div>

      <div class="input-wrapper">
        <input id="dummy-input" type="text" placeholder="Message #askreddit" class="message-input">
      </div>
    </div>

    <div id="thread-sidebar" class="thread-sidebar hidden">
      <div class="thread-header">
        <span>Thread Comments</span>
        <button onclick="closeThread()" class="close-btn">✕</button>
      </div>
      <div id="thread-body" class="thread-body"></div>
    </div>
  </div>

  <div id="panic-overlay">
    <div style="max-width: 800px; margin: 0 auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; padding-bottom: 16px;">
        <h2 style="color: white; font-size: 16px;">⚠️ Shopify Support Log #70665123</h2>
        <button onclick="togglePanic()" style="background: #374151; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">Resume Workspace</button>
      </div>
      <div style="background: #222529; padding: 16px; margin-top: 16px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #10B981;">
        [2026-10-15 17:50:12 UTC] STATUS: RESOLVED - Merchant Migration Rates
      </div>
    </div>
  </div>

  <script>
    let defaultChannels = ['askreddit', 'technology', 'worldnews', 'funny', 'todayilearned', 'python'];
    let currentChannel = 'askreddit';

    // REPLACE OR ADD YOUR GITHUB UPLOADED PFPs HERE (e.g. ['./pfp1.png', './pfp2.jpg'])
    let customAvatars = [];

    function getAvatar(username) {
      if (customAvatars.length > 0) {
        // Hash the username to consistently pick the same profile picture for the same user
        let hash = 0;
        for (let i = 0; i < username.length; i++) hash = username.charCodeAt(i) + ((hash << 5) - hash);
        const index = Math.abs(hash) % customAvatars.length;
        return customAvatars[index];
      }
      // Fallback to identicon if array is empty
      return `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(username)}`;
    }

    async function fetchRSS(subreddit) {
      const rssUrl = `https://www.reddit.com/r/${subreddit}/.rss`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error("Fetch failed");
      return await res.json();
    }

    async function fetchCommentsRSS(link) {
      const cleanLink = link.split('?')[0].replace(/\/$/, '');
      const rssUrl = `${cleanLink}/.rss`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error("Fetch failed");
      return await res.json();
    }

    function init() {
      renderChannels();
      switchChannel(currentChannel);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') togglePanic();
      });
    }

    function renderChannels() {
      const container = document.getElementById('channels-container');
      container.innerHTML = '';
      defaultChannels.forEach(ch => {
        const activeClass = ch.toLowerCase() === currentChannel.toLowerCase() ? 'active' : '';
        container.innerHTML += `
          <div class="channel-item ${activeClass}" onclick="switchChannel('${ch}')">
            <span class="channel-prefix">#</span>
            <span>${ch}</span>
          </div>
        `;
      });
    }

    async function switchChannel(channelName) {
      currentChannel = channelName.replace(/^r\//, '').replace(/^#/, '').toLowerCase();
      document.getElementById('channel-title').innerText = currentChannel;
      document.getElementById('dummy-input').placeholder = `Message #${currentChannel}`;
      renderChannels();
      closeThread();
      loadCurrentChannel();
    }

    async function loadCurrentChannel() {
      const container = document.getElementById('messages-container');
      container.innerHTML = `<div style="color: #9CA3AF; text-align: center; padding: 40px; font-size: 12px;">Syncing #${currentChannel}...</div>`;

      try {
        const data = await fetchRSS(currentChannel);
        container.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          container.innerHTML = `<div style="color: #9CA3AF; padding: 20px; font-size: 12px;">No posts found for #${currentChannel}.</div>`;
          return;
        }

        data.items.forEach(p => {
